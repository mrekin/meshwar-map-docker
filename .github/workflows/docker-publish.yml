name: Build & Publish Docker Image

# Manual dispatch only. Choose which branch/tag to build from
# and what tag to publish the image under. Each architecture is built as a
# separate single-platform image with its own tag:
#   amd64 -> <tag>      (+ latest      if push_latest)
#   arm64 -> <tag>-arm64 (+ latest-arm64 if push_latest)
on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or git tag to build from (e.g. main, v1.2.0)"
        required: true
        default: "main"
      tag:
        description: "Image tag to publish (e.g. 1.3.0, manual-2026-07-20)"
        required: true
        default: "manual"
      push_latest:
        description: "Also tag as 'latest' / 'latest-arm64'"
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Build each arch as its own job: they run in parallel, and an arm64
    # failure (QEMU cross-build is fragile) won't cancel the amd64 publish.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: ""
            cache_scope: amd64
          - platform: linux/arm64
            suffix: "-arm64"
            cache_scope: arm64
    # One slot per (tag, arch): arches of the same dispatch run concurrently,
    # while two dispatches sharing a tag+arch serialize instead of racing.
    concurrency:
      group: docker-publish-${{ github.event.inputs.tag }}-${{ matrix.platform }}
      cancel-in-progress: false
    steps:
      # Validate inputs BEFORE using them in checkout ref / image tags.
      # Inputs flow into a git ref and a Docker tag, so reject anything
      # outside the allowed charset to prevent ref/shell-injection vectors.
      - name: Validate inputs
        env:
          BRANCH: ${{ github.event.inputs.branch }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          # Git ref: letters, digits, and . _ / - (covers branches and tags)
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]]; then
            echo "::error::Invalid 'branch' input: '$BRANCH' (allowed: A-Z a-z 0-9 . _ / -)"
            exit 1
          fi
          # Docker tag: letters, digits, and . _ -
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Invalid 'tag' input: '$TAG' (allowed: A-Z a-z 0-9 . _ -)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        env:
          REPO: ${{ github.repository }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          PUSH_LATEST: ${{ github.event.inputs.push_latest }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          # GHCR requires lowercase; lowercase defensively in case the repo is renamed.
          IMAGE="${{ env.REGISTRY }}/$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          TAGS="${IMAGE}:${INPUT_TAG}${SUFFIX}"
          if [ "$PUSH_LATEST" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:latest${SUFFIX}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Scope the cache per arch so arm64 never reuses amd64 layer cache.
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}
